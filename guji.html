<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>古籍研读 · 金刚经</title>
<style>
:root{--bg:#eef1ee;--panel:#e3e8e4;--ink:#1c2422;--sub:#55625d;--acc:#2d4a6a;--mark:#b8861b;--line:#c5cec8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181b;--panel:#1c2226;--ink:#e6ebe8;--sub:#9aa8a2;--acc:#8fb3dc;--mark:#e0b24a;--line:#2f3a40}}
:root[data-theme="dark"]{--bg:#14181b;--panel:#1c2226;--ink:#e6ebe8;--sub:#9aa8a2;--acc:#8fb3dc;--mark:#e0b24a;--line:#2f3a40}
*{box-sizing:border-box}html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;line-height:1.7}
.serif{font-family:"Songti SC","Noto Serif SC","Source Han Serif SC","SimSun",serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.12em}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
button:hover{border-color:var(--acc)}button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
#menu{display:none}
.wrap{display:flex;max-width:1100px;margin:0 auto}
nav{width:270px;flex:none;padding:18px 14px;position:sticky;top:57px;align-self:flex-start;max-height:calc(100vh - 57px);overflow:auto}
nav select{width:100%;margin-bottom:12px;padding:7px;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px}
nav a{display:block;padding:6px 10px;border-left:3px solid transparent;color:var(--ink);text-decoration:none;font-size:15px;cursor:pointer}
nav a:hover{background:var(--panel)}nav a.cur{border-left-color:var(--acc);background:var(--panel);font-weight:600}
nav a.empty{color:var(--sub)}
main{flex:1;min-width:0;padding:22px 24px 80px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;align-items:center}
h2{font-size:26px;margin:0 0 6px;letter-spacing:.08em}
.sum{color:var(--sub);margin:0 0 24px;padding:10px 14px;background:var(--panel);border-radius:6px;font-size:15px}
.s{padding:2px 0 18px 18px;margin-bottom:18px;border-left:3px solid var(--line)}
.s:hover{border-left-color:var(--acc)}
.t{font-size:calc(1.35rem*var(--fs,1));line-height:1.95;margin:0}
.t mark{background:none;color:inherit;border-bottom:2px dotted var(--mark);cursor:help}
rt{font-size:.45em;color:var(--sub);font-family:-apple-system,"PingFang SC",sans-serif;font-weight:400;letter-spacing:0}.hide-py rt{display:none}
.tr{margin:6px 0 0;color:var(--acc);font-size:calc(1rem*var(--fs,1))}
.nt{margin:8px 0 0;padding:0;list-style:none;font-size:calc(.92rem*var(--fs,1));color:var(--sub)}
.nt li{margin:3px 0}.nt b{color:var(--mark);font-weight:600}
.hide-tr .tr,.hide-nt .nt{display:none}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:30px}
.todo{padding:30px;text-align:center;color:var(--sub);border:1px dashed var(--line);border-radius:8px}
@media (max-width:760px){
#menu{display:inline-block}
nav{position:fixed;inset:0 25% 0 0;top:0;max-height:none;z-index:9;background:var(--bg);border-right:1px solid var(--line);padding-top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-102%);transition:transform .2s}
nav.open{transform:none}
main{padding:16px 14px 70px}h2{font-size:22px}.t{font-size:calc(1.2rem*var(--fs,1))}
}
@media (prefers-reduced-motion:reduce){nav{transition:none}}
</style>
</head>
<body>
<header>
<button id="menu" aria-label="目录">目录</button>
<h1 class="serif" id="bt">古籍研读</h1>
<button id="th" aria-label="切换明暗">明/暗</button>
</header>
<div class="wrap">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<script>
/* ===== 扩展方法：在 LIBRARY 数组里追加一个对象即可新增古籍 =====
   { id, title, sub, chapters:[ { title, summary, s:[ { t:"原文，用 {词|批注} 标注关键词", tr:"白话译文" } ] } ] }
   章节暂无内容时 s 留空数组，目录里会灰显。
   生僻字注音：在书的对象里加 py:{字:"拼音"}，该字在每句原文里首次出现时自动标注。 */
const LIBRARY=[{
id:"jingang",title:"金刚经",sub:"姚秦 · 鸠摩罗什 译",
py:{祇:"qí",给:"jǐ",舍:"shè",钵:"bō",著:"zhuó",乞:"qǐ",讫:"qì",敷:"fū",袒:"tǎn",须:"xū",菩:"pú",提:"tí",萨:"sà",诃:"hē",摩:"mó",阿:"ā",耨:"nòu",藐:"miǎo",谛:"dì",嘱:"zhǔ",涅:"niè",槃:"pán",卵:"luǎn",唯:"wěi",乐:"yào",长:"zhǎng",陀:"tuó",洹:"huán",斯:"sī",含:"hán",诤:"zhèng",昧:"mèi",兰:"lán",弥:"mí",恒:"héng",般:"bō",瞋:"chēn",闇:"àn",诳:"kuáng",僧:"sēng",劫:"jié",荷:"hè",堕:"duò",涕:"tì",迦:"jiā",牟:"móu",偈:"jì",谤:"bàng",颇:"pō",婆:"pó",塞:"sāi",夷:"yí"},
chapters:[
{title:"法会因由分第一",summary:"交代说法的时间、地点与听众，并以乞食、用餐、净足、安坐的日常，作为全经的开场。",s:[
{t:"{如是我闻|佛经开头的固定句式，相传由阿难结集时转述，表明内容确为亲闻于佛。}。",tr:"我是这样亲耳听佛陀说的。"},
{t:"一时，佛在{舍卫国|古印度大国，佛陀长期弘法之地。}{祇树给孤独园|又称祇园精舍。给孤独长者购地，祇陀太子献树，故名。}，与{大比丘众|受具足戒的出家男众。}千二百五十人俱。",tr:"有一次，佛陀在舍卫国的祇树给孤独园，和一千二百五十位出家弟子在一起。"},
{t:"尔时，{世尊|对佛的尊称，意为被世间所尊重者。}食时，著衣持钵，入舍卫大城{乞食|出家人托钵化缘，是修行的一部分。}。",tr:"那时临近用餐，世尊穿好袈裟、托着饭钵，走进舍卫大城乞食。"},
{t:"于其城中{次第乞已|不择贫富、依次乞食，体现平等心。}，还至本处。",tr:"在城中依次乞食完毕，回到住处。"},
{t:"饭食讫，收衣钵，洗足已，敷座而坐。",tr:"用完餐，收好衣钵，洗净双脚，铺好座位坐下。"}]},
{title:"善现启请分第二",summary:"须菩提请教：发了无上正觉之心的人，心该安住在哪里，又如何降伏妄心？这是全经的核心问题。",s:[
{t:"时，长老{须菩提|佛陀十大弟子之一，被称为“解空第一”。又名善现。}在大众中，即从座起，偏袒右肩，右膝著地，合掌恭敬而白佛言：",tr:"这时，长老须菩提在大众中从座位站起，露出右肩，右膝着地，合掌恭敬地对佛说："},
{t:"“希有，世尊！如来善护念诸菩萨，善付嘱诸菩萨。”",tr:"“真是稀有啊，世尊！如来善于护念、善于嘱托诸位菩萨。”"},
{t:"“世尊！善男子、善女人，发{阿耨多罗三藐三菩提|梵语音译，意为“无上正等正觉”，即成佛的最高觉悟。}心，应云何住？云何降伏其心？”",tr:"“世尊！善男子、善女人发愿求无上正觉，心应当怎样安住？又怎样降伏它的妄念？”"},
{t:"佛言：“善哉，善哉！须菩提！如汝所说，如来善护念诸菩萨，善付嘱诸菩萨。”",tr:"佛说：“好啊，好啊！须菩提！正如你所说，如来善于护念、嘱托诸菩萨。”"},
{t:"“汝今谛听，当为汝说：善男子、善女人，发阿耨多罗三藐三菩提心，应如是住，如是降伏其心。”",tr:"“你现在仔细听，我为你说：发无上正觉心的人，就应当这样安住，这样降伏其心。”"},
{t:"“唯然，世尊！愿乐欲闻。”",tr:"“是的，世尊！我们愿意欢喜聆听。”"}]},
{title:"大乘正宗分第三",summary:"佛回答“如何降伏其心”：度尽一切众生，却不执着有众生被度；有“我相”等四相，便不是菩萨。",s:[
{t:"佛告须菩提：“诸{菩萨摩诃萨|菩萨：求觉悟并度化众生者；摩诃萨：大菩萨。}，应如是降伏其心：",tr:"佛告诉须菩提：“诸位大菩萨，应当这样降伏其心："},
{t:"所有一切众生之类，若{卵生、胎生、湿生、化生|佛经对生命诞生方式的四种分类：鸟类、哺乳类、虫类、忽然显现者。}，若有色、若无色，若有想、若无想、若非有想非无想，",tr:"凡是一切众生，无论卵生、胎生、湿生、化生，有形体的、无形体的，有思想的、没有思想的、既非有想又非无想的，"},
{t:"我皆令入{无余涅槃|烦恼与生死轮回都已灭尽的究竟解脱。}而灭度之。",tr:"我都使他们进入无余涅槃，得到究竟解脱。"},
{t:"如是灭度无量无数无边众生，{实无众生得灭度者|关键转折：度众生而不执着“我度了众生”，否则仍是执相。}。",tr:"这样度化了无量无数无边的众生，实际上并没有哪一个众生被我度化。"},
{t:"何以故？须菩提！若菩萨有{我相、人相、众生相、寿者相|四相：执着自我、他人、群体、生命延续为实有，是《金刚经》反复破除的对象。}，即非菩萨。”",tr:"为什么呢？须菩提！如果菩萨心中还有我相、人相、众生相、寿者相，就不是真正的菩萨。”"}]},
{title:"妙行无住分第四",summary:"布施而不住相：不执着于色、声、香、味、触、法，福德才不可限量。",s:[
{t:"“复次，须菩提！菩萨于法，应{无所住|心不黏着、不停驻于任何事相，全经的关键词。}行于{布施|给予他人财物、教法或无畏，为六度之首。}，",tr:"“再者，须菩提！菩萨对于一切事物，应当不执着地行布施，"},
{t:"所谓不住色布施，不住声、香、味、触、法布施。",tr:"也就是不执着于形色布施，不执着于声、香、味、触、法布施。"},
{t:"须菩提！菩萨应如是布施，不住于相。何以故？若菩萨不住相布施，其福德不可思量。",tr:"须菩提！菩萨应当这样布施，不执着于相。为什么呢？菩萨若不住相布施，他的福德不可思量。"},
{t:"“须菩提！于意云何？{东方虚空|“虚空”在此比喻广大无边、不可测量。}可思量不？”“不也，世尊！”",tr:"“须菩提！你怎么看？东方的虚空，可以测量吗？”“不可以，世尊！”"},
{t:"“须菩提！南、西、北方、{四维|东南、西南、东北、西北四个方位。}、上、下虚空，可思量不？”“不也，世尊！”",tr:"“须菩提！南方、西方、北方、四个角落、上方、下方的虚空，可以测量吗？”“不可以，世尊！”"},
{t:"“须菩提！菩萨无住相布施，福德亦复如是不可思量。须菩提！菩萨但应如所教住！”",tr:"“须菩提！菩萨不执着于相而布施，福德也像虚空一样不可测量。须菩提！菩萨只要照我所教的这样安住就可以了！”"}]},
{title:"如理实见分第五",summary:"以“身相”为例，说明不能凭外在形相认定如来；凡有形相皆是虚妄，若能见诸相并非实有，才算见到如来。",s:[
{t:"“须菩提！于意云何？可以{身相|佛的色身，即肉身所具有的形相。}见{如来|佛的十号之一，意为“如实而来、如实而去者”。}不？”“不也，世尊！不可以身相得见如来。”",tr:"“须菩提！你怎么看？可以凭身相见到如来吗？”“不可以，世尊！不能凭身相见到如来。”"},
{t:"何以故？如来所说身相，{即非身相|《金刚经》常用句式“即非X，是名X”的前半：否定X有固定不变的实体。}。",tr:"为什么呢？如来所说的身相，并不是真正固定不变的身相。"},
{t:"佛告须菩提：“凡所有相，皆是{虚妄|不真实；形相由因缘聚合而成，没有固定不变的自性。}。若见诸相非相，即见如来。”",tr:"佛告诉须菩提：“凡是有形相的，都是虚妄不实的。如果能看出种种形相并非真实的相，就是见到如来了。”"}]},{title:"正信希有分第六",summary:"须菩提问后世众生能否对此深奥的言说生起真实信心；佛答可以，并以“筏喻”说明连佛法也不可执着。",s:[
{t:"须菩提白佛言：“世尊！颇有众生，得闻如是{言说章句|指经中的言语与章节句子。}，生{实信|真实而非盲目的信心。}不？”",tr:"须菩提对佛说：“世尊！会有众生听到这样的言说章句，生起真实的信心吗？”"},
{t:"佛告须菩提：“莫作是说！如来灭后，{后五百岁|佛灭度后第五个五百年，一般指佛法衰微的后世；具体年代诸说不一。}，有持戒修福者，于此章句，能生信心，以此为实。”",tr:"佛告诉须菩提：“不要这样说！如来灭度以后，在后五百岁，有持守戒律、修习福德的人，对这些章句能生起信心，并把它当作真实。”"},
{t:"当知是人，不于一佛、二佛、三四五佛而种{善根|能生出善果的根基，指善的因缘与习性。}，已于无量千万佛所种诸善根。",tr:"应当知道，这样的人不只是在一尊、两尊、三四五尊佛那里种下善根，而是早已在无量千万尊佛那里种下了善根。"},
{t:"闻是章句，乃至一念生净信者；须菩提！如来悉知悉见，是诸众生得如是无量福德。",tr:"听到这些章句，哪怕只生起一念清净信心的人，须菩提！如来都完全知道、完全看见，这些众生得到这样无量的福德。"},
{t:"何以故？是诸众生，无复我相、人相、众生相、寿者相、{无法相，亦无非法相|“法相”指执着佛法为实有；“非法相”指执着“什么都没有”。两头都不执着。}。",tr:"为什么呢？这些众生不再有我相、人相、众生相、寿者相，也没有“法相”，同时也没有“非法相”。"},
{t:"何以故？是诸众生若心取相，即为着我、人、众生、寿者。若取法相，即着我、人、众生、寿者。何以故？若取非法相，即着我、人、众生、寿者。是故不应取法，不应取非法。",tr:"为什么呢？这些众生如果心里执取任何相，就是执着于我、人、众生、寿者。若执取法相，也是执着这四相；若执取非法相，同样是执着这四相。所以既不应执取法，也不应执取非法。"},
{t:"以是义故，如来常说：汝等比丘！知我说法，如{筏喻|筏，渡河用的木筏。过了河就该舍筏，比喻佛法是渡人的工具，不应执着。}者；法尚应舍，何况非法？”",tr:"因为这个道理，如来常说：你们这些比丘！要明白我所说的法就像渡河的木筏；连佛法都应当舍弃，何况不是佛法的东西呢？”"}]},{title:"无得无说分第七",summary:"须菩提答：佛所证的觉悟与所说的法都没有固定不变的形式，圣贤的差别正是源于对无为法的体悟。",s:[
{t:"“须菩提！于意云何？如来得阿耨多罗三藐三菩提耶？如来有所说法耶？”",tr:"“须菩提！你怎么看？如来证得了无上正等正觉吗？如来有所说的法吗？”"},
{t:"须菩提言：“如我解佛所说义，{无有定法|没有固定不变的法。}，名阿耨多罗三藐三菩提；亦无有定法如来可说。",tr:"须菩提说：“依我对佛所讲道理的理解，并没有一个固定不变的法叫做无上正等正觉，也没有一个固定的法是如来可以说的。"},
{t:"何以故？如来所说法，皆不可取、不可说；非法、非非法。",tr:"为什么呢？如来所说的法，都不可执取、不可用言语完全表达；它既不是法，也不是非法。"},
{t:"所以者何？一切贤圣，皆以{无为法|不依因缘造作、不生不灭的真理或境界。}，而有差别。”",tr:"这是为什么呢？一切贤圣，都是因为对无为法的体悟不同，才有了差别。”"}]},{title:"依法出生分第八",summary:"比较以七宝布施与受持、讲说此经的福德，指出后者更胜，因为诸佛及其觉悟之法都是从此经而出。",s:[
{t:"“须菩提！于意云何？若人满{三千大千世界|佛教宇宙观：千个小世界为小千，千个小千为中千，千个中千为大千，合称三千大千世界。}{七宝|七种珍宝，各经所列略有不同。}，以用布施。是人所得福德，宁为多不？”",tr:"“须菩提！你怎么看？如果有人用装满三千大千世界的七宝来布施，这个人所得的福德，多不多呢？”"},
{t:"须菩提言：“甚多。世尊！何以故？是福德，即非福性。是故如来说福德多。”",tr:"须菩提说：“很多，世尊！为什么呢？这种福德并不是真有福德的自性，所以如来才说福德多。”"},
{t:"“若复有人，于此经中，受持乃至{四句偈|由四句组成的偈颂；经中未特指是哪四句，后世说法不一。}等，为他人说，其福胜彼。",tr:"“如果又有人对这部经受持，哪怕只是其中的四句偈，并为他人讲说，他的福德胜过前者。"},
{t:"何以故？须菩提！一切诸佛，及诸佛阿耨多罗三藐三菩提法，皆从此经出。须菩提！所谓佛法者，即非佛法。”",tr:"为什么呢？须菩提！一切诸佛，以及诸佛的无上正等正觉之法，都是从这部经而出。须菩提！所说的佛法，并不是固定实有的佛法。”"}]},{title:"一相无相分第九",summary:"借声闻四果（须陀洹、斯陀含、阿那含、阿罗汉）说明：真正证果的人不会生起“我证得了”的念头，否则便是执着四相。",s:[
{t:"“须菩提！于意云何？{须陀洹|声闻乘四果的初果，意译“入流”，即入圣道之流。}能作是念，我得须陀洹果不？”",tr:"“须菩提！你怎么看？须陀洹能够这样想：‘我得到了须陀洹果’吗？”"},
{t:"须菩提言：“不也。世尊！何以故？须陀洹名为入流，而无所入；不入色、声、香、味、触、法。是名须陀洹。”",tr:"须菩提说：“不会的，世尊！为什么呢？须陀洹被称为‘入流’，其实并没有可入的地方；他不入于色、声、香、味、触、法，这才叫须陀洹。”"},
{t:"“须菩提！于意云何？{斯陀含|四果中的二果，意译“一往来”：还要往返人间一次，便证涅槃。}能作是念，我得斯陀含果不？”须菩提言：“不也。世尊！何以故？斯陀含名一往来，而实无往来，是名斯陀含。”",tr:"“须菩提！你怎么看？斯陀含能够这样想：‘我得到了斯陀含果’吗？”须菩提说：“不会的，世尊！为什么呢？斯陀含的意思是‘一往来’，其实并没有往来，这才叫斯陀含。”"},
{t:"“须菩提，于意云何？{阿那含|四果中的三果，意译“不来”：不再回到欲界受生。}能作是念，我得阿那含果不？”须菩提言：“不也。世尊！何以故？阿那含名为不来，而实无不来，是故名阿那含。”",tr:"“须菩提！你怎么看？阿那含能够这样想：‘我得到了阿那含果’吗？”须菩提说：“不会的，世尊！为什么呢？阿那含的意思是‘不来’，其实也并没有‘不来’这回事，所以叫阿那含。”"},
{t:"“须菩提！于意云何？{阿罗汉|四果中的最高果位，意为断尽烦恼、应受供养者。}能作是念，我得阿罗汉道不？”须菩提言：“不也。世尊！何以故？实无有法名阿罗汉。",tr:"“须菩提！你怎么看？阿罗汉能够这样想：‘我得到了阿罗汉道’吗？”须菩提说：“不会的，世尊！为什么呢？实际上没有一个法叫做阿罗汉。"},
{t:"世尊！若阿罗汉作是念，我得阿罗汉道，即为着我、人、众生、寿者。",tr:"世尊！如果阿罗汉这样想：‘我得到了阿罗汉道’，那就是执着于我、人、众生、寿者了。"},
{t:"世尊！佛说我得{无诤三昧|三昧：心专注一境的禅定；无诤：不与人争，不起对立之心。}，人中最为第一，是第一{离欲阿罗汉|已离贪欲的阿罗汉。}。",tr:"世尊！佛说我得到了无诤三昧，在人当中最为第一，是第一的离欲阿罗汉。"},
{t:"世尊！我不作是念：‘我是离欲阿罗汉。’",tr:"世尊！我没有这样想：‘我是离欲阿罗汉。’"},
{t:"世尊！我若作是念，我得阿罗汉道，世尊则不说须菩提是乐{阿兰那行|阿兰那意为寂静处；阿兰那行即喜好寂静的修行。}者，以须菩提实无所行，而名须菩提，是乐阿兰那行。”",tr:"世尊！我如果这样想：‘我得到了阿罗汉道’，世尊就不会说须菩提是喜好阿兰那行的人了。正因为须菩提实际上没有所行之相，才称须菩提是喜好阿兰那行的人。”"}]},{title:"庄严净土分第十",summary:"释迦在然灯佛处实无所得；庄严佛土而不执着庄严之相；并给出“应无所住，而生其心”这一要点。",s:[
{t:"佛告须菩提：“于意云何？如来昔在{然灯佛|据佛经所说，是释迦牟尼前世遇到的过去佛，曾为其授记。}所，于法有所得不？”“不也，世尊！如来在然灯佛所，于法实无所得。”",tr:"佛告诉须菩提：“你怎么看？如来从前在然灯佛那里，对于法有所得吗？”“没有，世尊！如来在然灯佛那里，对于法实在没有什么可得。”"},
{t:"“须菩提！于意云何？菩萨{庄严佛土|以功德智慧成就清净的佛国，称为庄严。}不？”“不也。世尊！何以故？庄严佛土者，即非庄严，是名庄严。”",tr:"“须菩提！你怎么看？菩萨庄严佛土吗？”“不是的，世尊！为什么呢？所说的庄严佛土，并不是执着的庄严，只是假名叫做庄严。”"},
{t:"“是故，须菩提！诸菩萨摩诃萨，应如是生清净心，不应住色生心，不应住声、香、味、触、法生心，{应无所住，而生其心|《金刚经》最著名的句子之一。据《六祖坛经》记载，慧能听人诵至此句而有所悟。}。",tr:"“所以，须菩提！诸位大菩萨应当这样生起清净心：不执着于色而生心，不执着于声、香、味、触、法而生心，应当不住于任何事物，而生起那个心。"},
{t:"须菩提！譬如有人，身如{须弥山王|佛教宇宙观中位于世界中心的大山，象征极其高大。}，于意云何？是身为大不？”须菩提言：“甚大。世尊！何以故？佛说非身，是名大身。”",tr:"须菩提！譬如有人，身体像须弥山王那样，你怎么看？这个身体算大吗？”须菩提说：“很大，世尊！为什么呢？佛说那并不是真有的身，只是假名叫做大身。”"}]},{title:"无为福胜分第十一",summary:"以恒河沙为喻，再次比较七宝布施与受持、讲说四句偈的福德。",s:[
{t:"“须菩提！如{恒河|印度的大河；佛经常以“恒河沙”比喻数量极多。}中所有沙数，如是沙等恒河，于意云何？是诸恒河沙，宁为多不？”须菩提言：“甚多。世尊！但诸恒河，尚多无数，何况其沙？”",tr:"“须菩提！像恒河里所有的沙粒那么多，再有同样多的恒河，你怎么看？这些恒河里的沙，算多吗？”须菩提说：“很多，世尊！光是这些恒河就已多得无数，何况它们的沙呢？”"},
{t:"“须菩提！我今实言告汝，若有善男子、善女人，以七宝满尔所恒河沙数三千大千世界，以用布施，得福多不？”须菩提言：“甚多。世尊！”",tr:"“须菩提！我现在如实地告诉你：如果有善男子、善女人，用七宝装满像那些恒河沙数一样多的三千大千世界来布施，得的福多吗？”须菩提说：“很多，世尊！”"},
{t:"佛告须菩提：“若善男子、善女人，于此经中，乃至受持四句偈等，为他人说，而此福德，胜前福德。”",tr:"佛告诉须菩提：“如果善男子、善女人对这部经受持，哪怕只是其中的四句偈，并为他人讲说，这个福德就胜过前面的福德。”"}]},{title:"尊重正教分第十二",summary:"说经之处应受天、人、阿修罗供养，如同佛塔庙；受持读诵此经者成就最上第一希有之法。",s:[
{t:"复次：“须菩提！随说是经，乃至四句偈等，当知此处，一切世间天、人、{阿修罗|佛教六道之一，好斗的神类。}，皆应供养，如佛塔庙。",tr:"再者：“须菩提！无论在哪里讲说这部经，哪怕只是四句偈，应当知道这个地方，一切世间的天、人、阿修罗，都应当供养，如同供养佛塔和寺庙一样。"},
{t:"何况有人，尽能受持、读诵。须菩提！当知是人，成就最上第一希有之法；",tr:"何况有人能够全部受持、读诵。须菩提！应当知道这个人，成就了最上、第一、稀有的法；"},
{t:"若是经典所在之处，即为有佛，若尊重弟子。”",tr:"这部经典所在之处，就等于有佛在，或者有受尊重的佛弟子在。”"}]},{title:"如法受持分第十三",summary:"佛为此经定名《金刚般若波罗蜜》，并以微尘、世界、三十二相再次说明“即非…是名…”，最后重申受持此经福德殊胜。",s:[
{t:"尔时，须菩提白佛言：“世尊！当何名此经？我等云何奉持？”",tr:"这时，须菩提对佛说：“世尊！这部经应当叫什么名字？我们应当怎样奉持？”"},
{t:"佛告须菩提：“是经名为{金刚般若波罗蜜|“金刚”比喻坚固锋利；“般若”意为智慧；“波罗蜜”意为到彼岸。}，以是名字，汝当奉持。所以者何？须菩提！佛说般若波罗蜜，即非般若波罗蜜，是名般若波罗蜜。",tr:"佛告诉须菩提：“这部经名叫金刚般若波罗蜜，就用这个名字，你们应当奉持。为什么呢？须菩提！佛所说的般若波罗蜜，并不是执着实有的般若波罗蜜，只是假名叫做般若波罗蜜。"},
{t:"须菩提！于意云何？如来有所说法不？”须菩提白佛言：“世尊！如来无所说。”",tr:"须菩提！你怎么看？如来有所说的法吗？”须菩提对佛说：“世尊！如来没有什么可说的。”"},
{t:"“须菩提！于意云何？三千大千世界所有{微尘|极细小的尘粒。}，是为多不？”须菩提言：“甚多。世尊！”“须菩提！诸微尘，如来说非微尘，是名微尘。如来说世界非世界，是名世界。",tr:"“须菩提！你怎么看？三千大千世界中所有的微尘，算多吗？”须菩提说：“很多，世尊！”“须菩提！这些微尘，如来说并不是固定实有的微尘，只是假名叫做微尘。如来说的世界也不是实有的世界，只是假名叫做世界。"},
{t:"须菩提，于意云何？可以{三十二相|佛所具有的三十二种殊胜形相。}见如来不？”“不也。世尊！不可以三十二相得见如来。何以故？如来说三十二相，即是非相，是名三十二相。”",tr:"须菩提，你怎么看？可以凭三十二相见到如来吗？”“不可以，世尊！不能凭三十二相见到如来。为什么呢？如来说的三十二相，并不是实有的相，只是假名叫做三十二相。”"},
{t:"“须菩提！若有善男子、善女人，以恒河沙等身命布施，若复有人，于此经中，乃至受持四句偈等，为他人说，其福甚多！”",tr:"“须菩提！如果有善男子、善女人，用像恒河沙那么多的身体生命来布施；又如果有人对这部经受持，哪怕只是其中的四句偈，并为他人讲说，他的福德更多！”"}]},{title:"离相寂灭分第十四",summary:"须菩提闻经感泣，赞叹实相；佛以忍辱仙人、歌利王割截身体的往事说明忍辱波罗蜜与离相，并强调心不住法而布施。",s:[
{t:"尔时，须菩提闻说是经，深解义趣，涕泪悲泣，而白佛言：“希有！世尊。佛说如是甚深经典，我从昔来所得{慧眼|能照见空性真理的智慧之眼。}，未曾得闻如是之经。",tr:"这时，须菩提听了这部经，深深领会了其中的意趣，流泪悲泣，对佛说：“稀有啊，世尊！佛说这样甚深的经典，我从过去以来所得的慧眼，从未听到过这样的经。"},
{t:"世尊！若复有人得闻是经，信心清净，即生{实相|诸法真实不虚的本来面目。}。当知是人成就第一希有功德。世尊！是实相者，则是非相，是故如来说名实相。",tr:"世尊！如果有人听到这部经，信心清净，就会生起实相。应当知道这个人成就了第一稀有的功德。世尊！所谓实相，其实不是相，所以如来说它叫实相。"},
{t:"世尊！我今得闻如是经典，信解受持不足为难，若当来世后五百岁，其有众生，得闻是经，信解受持，是人则为第一希有。",tr:"世尊！我现在听到这样的经典，能信解受持并不算难；如果将来后五百岁，有众生听到这部经，能信解受持，这个人才是第一稀有。"},
{t:"何以故？此人无我相、人相、众生相、寿者相，所以者何？我相，即是非相；人相、众生相、寿者相，即是非相。何以故？离一切诸相，则名诸佛。”",tr:"为什么呢？这个人没有我相、人相、众生相、寿者相。为什么？因为我相就不是相；人相、众生相、寿者相也都不是相。为什么呢？远离一切相，就叫做诸佛。”"},
{t:"佛告须菩提：“如是，如是！若复有人，得闻是经，不惊、不怖、不畏，当知是人，甚为希有。",tr:"佛告诉须菩提：“是这样，是这样！如果有人听到这部经，不惊讶、不恐怖、不畏惧，应当知道这个人非常稀有。"},
{t:"何以故？须菩提！如来说第一{波罗蜜|梵语，意为“到彼岸”，指从生死此岸到解脱彼岸的修行，如布施、忍辱等六度。}即非第一波罗蜜，是名第一波罗蜜。须菩提！忍辱波罗蜜，如来说非忍辱波罗蜜，是名忍辱波罗蜜。",tr:"为什么呢？须菩提！如来说的第一波罗蜜，并不是执着实有的第一波罗蜜，只是假名叫做第一波罗蜜。须菩提！忍辱波罗蜜，如来说也不是实有的忍辱波罗蜜，只是假名叫做忍辱波罗蜜。"},
{t:"何以故？须菩提！如我昔为{歌利王|经中所说古印度的一位国王；其事迹见于佛经，各经细节不一。}割截身体，我于尔时，无我相、无人相、无众生相，无寿者相。",tr:"为什么呢？须菩提！譬如我从前被歌利王割截身体的时候，我那时没有我相、没有人相、没有众生相、没有寿者相。"},
{t:"何以故？我于往昔节节支解时，若有我相、人相、众生相、寿者相，应生{瞋恨|愤怒怨恨。}。",tr:"为什么呢？我在往昔被一节一节肢解的时候，如果有我相、人相、众生相、寿者相，就应当生起瞋恨。"},
{t:"须菩提！又念过去于五百世，作{忍辱仙人|经中说佛前世修忍辱行时的身份。}，于尔所世，无我相、无人相、无众生相、无寿者相。",tr:"须菩提！我又想起过去五百世中，做忍辱仙人，在那些世里，我没有我相、没有人相、没有众生相、没有寿者相。"},
{t:"是故，须菩提！菩萨应离一切相，发阿耨多罗三藐三菩提心，不应住色生心，不应住声、香、味、触、法生心，应生无所住心。若心有住，即为非住。是故佛说菩萨心，不应住色布施。",tr:"所以，须菩提！菩萨应当远离一切相，发无上正等正觉心，不应执着于色而生心，不应执着于声、香、味、触、法而生心，应当生起无所住的心。如果心有所住，就不是真正的安住。所以佛说菩萨的心不应当执着于色而布施。"},
{t:"须菩提！菩萨为利益一切众生故，应如是布施。如来说一切诸相，即是非相；又说一切众生，即非众生。",tr:"须菩提！菩萨为了利益一切众生，应当这样布施。如来说一切诸相就不是相；又说一切众生也不是实有的众生。"},
{t:"须菩提！如来是真语者、实语者、如语者、不诳语者、不异语者。",tr:"须菩提！如来是说真话的、说实话的、说如实话的、不说虚诳话的、不说前后不一的话的。"},
{t:"须菩提！如来所得此法，此法无实无虚。",tr:"须菩提！如来所证得的这个法，既没有实，也没有虚。"},
{t:"须菩提！若菩萨心住于法，而行布施，如人入闇，则无所见。若菩萨心不住法，而行布施，如人有目日光明照，见种种色。",tr:"须菩提！如果菩萨心执着于法而去布施，就像人走进黑暗之中，什么也看不见。如果菩萨心不执着于法而去布施，就像人有眼睛，又有日光明亮照耀，能看见种种形色。"},
{t:"须菩提！当来之世，若有善男子、善女人，能于此经受持、读诵，则为如来，以佛智慧，悉知是人，悉见是人，皆得成就无量无边功德。”",tr:"须菩提！将来之世，如果有善男子、善女人，能对这部经受持、读诵，如来就用佛的智慧，完全知道这个人，完全看见这个人，他们都成就无量无边的功德。”"}]},{title:"持经功德分第十五",summary:"以无量劫舍身布施相比，闻此经而信心不逆者福德更胜；受持此经者担荷无上菩提，经之所在如塔庙。",s:[
{t:"“须菩提！若有善男子、善女人，初日分以恒河沙等身布施；中日分复以恒河沙等身布施；后日分亦以恒河沙等身布施，如是无量百千万亿{劫|佛教中极长的时间单位。}，以身布施。",tr:"“须菩提！如果有善男子、善女人，在早晨用像恒河沙那么多的身体布施，中午又用像恒河沙那么多的身体布施，傍晚也用像恒河沙那么多的身体布施，这样经过无量百千万亿劫，不断以身布施。"},
{t:"若复有人，闻此经典，信心不逆，其福胜彼。何况书写、受持、读诵、为人解说。",tr:"如果又有人听到这部经典，信心不违逆，他的福德就胜过前者，何况是抄写、受持、读诵、为人解说呢。"},
{t:"须菩提！以要言之，是经有不可思议，不可称量，无边功德，如来为发{大乘|“乘”意为运载；大乘重在度一切众生、成就佛道。}者说，为发最上乘者说，若有人能受持、读诵、广为人说，如来悉知是人、悉见是人，皆得成就不可量、不可称、无有边、不可思议功德，如是人等，即为荷担如来阿耨多罗三藐三菩提。",tr:"须菩提！简要地说，这部经有不可思议、不可称量、无边的功德。如来是为发大乘心的人说，为发最上乘心的人说。如果有人能受持、读诵、广为人说，如来完全知道这个人、完全看见这个人，他们都成就不可衡量、不可称量、无有边际、不可思议的功德。这样的人，就是在承担如来的无上正等正觉。"},
{t:"何以故？须菩提！若乐小法者，着我见、人见、众生见、寿者见，则于此经不能听受、读诵、为人解说。",tr:"为什么呢？须菩提！喜好小乘法的人，执着我见、人见、众生见、寿者见，就不能听受、读诵这部经，也不能为人解说。"},
{t:"须菩提！在在处处，若有此经，一切世间，天、人、阿修罗所应供养，当知此处，则为是塔，皆应恭敬，作礼围绕，以诸华香而散其处。”",tr:"须菩提！无论什么地方，只要有这部经，一切世间的天、人、阿修罗都应当供养。应当知道这个地方就如同佛塔，大家都应当恭敬，行礼绕行，并用各种花和香散布在那里。”"}]},{title:"能净业障分第十六",summary:"受持此经而被人轻贱，先世罪业可由此消灭；佛以往昔供养诸佛的功德作比，说明受持此经的功德不可思议。",s:[
{t:"复次：“须菩提！善男子、善女人，受持、读诵此经，若为人轻贱，是人先世罪业，应堕{恶道|指地狱、饿鬼、畜生三种恶趣。}。以今世人轻贱故，先世罪业，则为消灭，当得阿耨多罗三藐三菩提。",tr:"再者：“须菩提！善男子、善女人受持、读诵这部经，如果被人轻视贱视，这个人先世的罪业，本来应当堕入恶道。因为今世被人轻贱，先世的罪业就此消灭，将能证得无上正等正觉。"},
{t:"须菩提！我念过去无量{阿僧祇劫|阿僧祇意为“无数”；劫是极长的时间。}，于然灯佛前，得值八百四千万亿那由他诸佛，悉皆供养承事，无空过者。",tr:"须菩提！我回想过去无量阿僧祇劫，在然灯佛之前，曾遇到八百四千万亿那由他尊佛，全部供养侍奉，没有一次空过。"},
{t:"若复有人，于后末世，能受持、读诵此经，所得功德，于我所供养诸佛功德，百分不及一，千万亿分，乃至算数譬喻所不能及。",tr:"如果又有人在后来的末世，能受持、读诵这部经，所得的功德，比起我供养诸佛的功德，百分不及其一，千万亿分也不及，乃至用算数、譬喻都无法相比。"},
{t:"须菩提！若善男子、善女人，于后末世，有受持、读诵此经，所得功德，我若具说者，或有人闻，心则狂乱，狐疑不信。",tr:"须菩提！如果善男子、善女人在后来的末世，有人受持、读诵这部经，所得的功德，我如果完整说出来，有人听了，心会狂乱，疑惑而不相信。"},
{t:"须菩提！当知是经义不可思议，果报亦不可思议。”",tr:"须菩提！应当知道，这部经的义理不可思议，它的果报也不可思议。”"}]},{title:"究竟无我分第十七",summary:"再次回答“如何安住、降伏其心”：度尽众生而无众生可度；然灯佛授记时，佛实无法可得；通达无我法，才是真菩萨。",s:[
{t:"尔时，须菩提白佛言：“世尊，善男子、善女人，发阿耨多罗三藐三菩提心，云何应住？云何降伏其心？”",tr:"这时，须菩提对佛说：“世尊，善男子、善女人发无上正等正觉心，应当怎样安住？怎样降伏其心？”"},
{t:"佛告须菩提：“善男子、善女人，发阿耨多罗三藐三菩提心者，当生如是心：我应灭度一切众生；灭度一切众生已，而无有一众生实灭度者。",tr:"佛告诉须菩提：“善男子、善女人发无上正等正觉心的人，应当生起这样的心：我应当度脱一切众生；度脱一切众生之后，实际上没有一个众生是被度脱的。"},
{t:"何以故？须菩提！若菩萨有我相、人相、众生相、寿者相，则非菩萨。所以者何？须菩提！实无有法，发阿耨多罗三藐三菩提心者。",tr:"为什么呢？须菩提！如果菩萨有我相、人相、众生相、寿者相，就不是菩萨。为什么这样说呢？须菩提！实际上并没有一个法，可以叫做发无上正等正觉心。"},
{t:"须菩提！于意云何？如来于然灯佛所，有法得阿耨多罗三藐三菩提不？”“不也。世尊！如我解佛所说义，佛于然灯佛所，无有法得阿耨多罗三藐三菩提。”",tr:"须菩提！你怎么看？如来在然灯佛那里，有法可得无上正等正觉吗？”“没有，世尊！依我对佛所说道理的理解，佛在然灯佛那里，没有什么法可以得到无上正等正觉。”"},
{t:"佛言：“如是！如是！须菩提！实无有法，如来得阿耨多罗三藐三菩提。",tr:"佛说：“是这样，是这样！须菩提！实际上没有什么法，是如来得到无上正等正觉的。"},
{t:"须菩提！若有法如来得阿耨多罗三藐三菩提者，然灯佛即不与我{授记|佛预先为弟子宣告其将来成佛。}：‘汝于来世当得作佛，号释迦牟尼。’以实无有法，得阿耨多罗三藐三菩提，是故然灯佛与我授记，作是言：‘汝于来世，当得作佛，号释迦牟尼。’",tr:"须菩提！如果有法是如来得到无上正等正觉的，然灯佛就不会给我授记说：‘你在来世将会成佛，名叫释迦牟尼。’正因为实际上没有什么法可得无上正等正觉，所以然灯佛才给我授记，这样说：‘你在来世将会成佛，名叫释迦牟尼。’"},
{t:"何以故？如来者，即{诸法如义|“如”指诸法真实如是的本性，即真如。}。若有人言：如来得阿耨多罗三藐三菩提，须菩提！实无有法，佛得阿耨多罗三藐三菩提。须菩提！如来所得阿耨多罗三藐三菩提，于是中无实无虚。是故如来说一切法，皆是佛法。",tr:"为什么呢？所谓如来，就是诸法如其本性的意思。如果有人说：如来得到了无上正等正觉，须菩提！实际上没有什么法是佛得到的。须菩提！如来所得的无上正等正觉，在其中既没有实，也没有虚。所以如来说一切法都是佛法。"},
{t:"须菩提！所言一切法者，即非一切法，是故名一切法。",tr:"须菩提！所说的一切法，并不是固定实有的一切法，所以才叫做一切法。"},
{t:"须菩提！譬如人身长大。”须菩提言：“世尊！如来说人身长大，则为非大身，是名大身。”",tr:"须菩提！譬如人的身体高大。”须菩提说：“世尊！如来说人的身体高大，就不是真有的大身，只是假名叫做大身。”"},
{t:"“须菩提！菩萨亦如是。若作是言：‘我当灭度无量众生。’则不名菩萨。何以故？须菩提！实无有法，名为菩萨。是故佛说：‘一切法，无我、无人、无众生、无寿者。’",tr:"“须菩提！菩萨也是这样。如果说：‘我要度脱无量众生。’就不能叫做菩萨。为什么呢？须菩提！实际上没有一个法叫做菩萨。所以佛说：‘一切法，没有我、没有人、没有众生、没有寿者。’"},
{t:"须菩提！若菩萨作是言：‘我当庄严佛土。’是不名菩萨。何以故？如来说庄严佛土者，即非庄严，是名庄严。须菩提！若菩萨通达无我法者，如来说名真是菩萨。”",tr:"须菩提！如果菩萨说：‘我要庄严佛土。’这就不能叫做菩萨。为什么呢？如来说的庄严佛土，并不是执着的庄严，只是假名叫做庄严。须菩提！如果菩萨通达无我之法，如来就说他是真正的菩萨。”"}]},{title:"一体同观分第十八",summary:"说明如来具有五眼，并以恒河沙、众生之心为例：过去、现在、未来之心都不可执取。",s:[
{t:"“须菩提！于意云何？如来有肉眼不？”“如是，世尊！如来有肉眼。”“须菩提！于意云何？如来有天眼不？”“如是，世尊！如来有天眼。”“须菩提！于意云何？如来有慧眼不？”“如是，世尊！如来有慧眼。”“须菩提！于意云何？如来有法眼不？”“如是，世尊！如来有法眼。”“须菩提！于意云何？如来有佛眼不？”“如是，世尊！如来有{佛眼|“五眼”依次为：肉眼、天眼、慧眼、法眼、佛眼，眼力逐层深广。}。”",tr:"“须菩提！你怎么看？如来有肉眼吗？”“有，世尊！如来有肉眼。”“如来有天眼吗？”“有，世尊！如来有天眼。”“如来有慧眼吗？”“有，世尊！如来有慧眼。”“如来有法眼吗？”“有，世尊！如来有法眼。”“如来有佛眼吗？”“有，世尊！如来有佛眼。”"},
{t:"“须菩提！于意云何？如恒河中所有沙，佛说是沙不？”“如是，世尊！如来说是沙。”",tr:"“须菩提！你怎么看？像恒河中所有的沙，佛说它是沙吗？”“是的，世尊！如来说它是沙。”"},
{t:"“须菩提！于意云何？如一恒河中所有沙，有如是沙等恒河，是诸恒河所有沙数，佛世界如是，宁为多不？”“甚多。世尊！”",tr:"“须菩提！你怎么看？如果一条恒河中所有的沙，每一粒沙又各有一条恒河，这些恒河中所有的沙数，就有那么多佛的世界，算多吗？”“很多，世尊！”"},
{t:"佛告须菩提：“尔所国土中，所有众生若干种心，如来悉知。何以故？如来说诸心，皆为非心，是名为心。所以者何？须菩提！过去心不可得，现在心不可得，未来心不可得。”",tr:"佛告诉须菩提：“在那么多国土中，所有众生种种的心，如来全都知道。为什么呢？如来说的种种心，都不是固定实有的心，只是假名叫做心。为什么这样说呢？须菩提！过去的心不可得，现在的心不可得，未来的心也不可得。”"}]},{title:"法界通化分第十九",summary:"福德若有实体，如来就不会说福德多；正因福德没有固定自性，才说福德多。",s:[
{t:"“须菩提！于意云何？若有人满三千大千世界七宝，以用布施，是人以是因缘，得福多不？”“如是，世尊！此人以是因缘，得福甚多。”",tr:"“须菩提！你怎么看？如果有人用装满三千大千世界的七宝来布施，这个人因为这个因缘，得的福多吗？”“多，世尊！这个人因为这个因缘，得福非常多。”"},
{t:"“须菩提！若福德有实，如来不说得福德多，以福德无故，如来说得福德多。”",tr:"“须菩提！如果福德是实有的，如来就不会说得福德多；正因为福德没有实体，如来才说得福德多。”"}]},{title:"离色离相分第二十",summary:"不应凭圆满的色身和圆满的诸相来见如来。",s:[
{t:"“须菩提！于意云何？佛可以具足{色身|佛的物质性身体，与法身相对。}见不？”“不也，世尊！如来不应以具足色身见。何以故？如来说具足色身，即非具足色身，是名具足色身。”",tr:"“须菩提！你怎么看？可以凭圆满的色身见到佛吗？”“不可以，世尊！不应凭圆满的色身见如来。为什么呢？如来说的圆满色身，并不是实有的圆满色身，只是假名叫做圆满色身。”"},
{t:"“须菩提！于意云何？如来可以具足诸相见不？”“不也，世尊！如来不应以具足诸相见。何以故？如来说诸相具足，即非诸相具足，是名诸相具足。”",tr:"“须菩提！你怎么看？可以凭圆满的诸相见到如来吗？”“不可以，世尊！不应凭圆满的诸相见如来。为什么呢？如来说的诸相圆满，并不是实有的诸相圆满，只是假名叫做诸相圆满。”"}]},{title:"非说所说分第二十一",summary:"佛并无“我有所说法”之念，说法而无法可说；未来众生是否生信，答以“非众生，非不众生”。",s:[
{t:"“须菩提！汝勿谓如来作是念：我当有所说法。莫作是念！",tr:"“须菩提！你不要认为如来会这样想：我应当有所说法。不要有这样的想法！"},
{t:"何以故？若人言如来有所说法，即为谤佛，不能解我所说故。须菩提！说法者，无法可说，是名说法。”",tr:"为什么呢？如果有人说如来有所说的法，就是诽谤佛，因为他不能理解我所说的意思。须菩提！所谓说法，其实没有什么法可说，只是假名叫做说法。”"},
{t:"尔时，{慧命|对德高年长比丘的尊称，意为“智慧之命”。}须菩提白佛言：“世尊！颇有众生，于未来世，闻说是法，生信心不？”",tr:"这时，慧命须菩提对佛说：“世尊！会有众生，在未来世听到这样的法，生起信心吗？”"},
{t:"佛言：“须菩提！彼非众生，非不众生。何以故？须菩提！众生，众生者，如来说非众生，是名众生。”",tr:"佛说：“须菩提！他们不是众生，也不是非众生。为什么呢？须菩提！所谓众生，如来说并不是实有的众生，只是假名叫做众生。”"}]},{title:"无法可得分第二十二",summary:"佛于无上正等正觉，连少许法也没有可得。",s:[
{t:"须菩提白佛言：“世尊！佛得阿耨多罗三藐三菩提，为无所得耶？”",tr:"须菩提对佛说：“世尊！佛证得无上正等正觉，是没有什么所得吗？”"},
{t:"佛言：“如是！如是！须菩提！我于阿耨多罗三藐三菩提，乃至无有少法可得，是名阿耨多罗三藐三菩提。”",tr:"佛说：“是这样，是这样！须菩提！我对于无上正等正觉，乃至没有一点点法可得，这才叫做无上正等正觉。”"}]},{title:"净心行善分第二十三",summary:"此法平等，没有高下；离四相而修一切善法，就得无上正等正觉。",s:[
{t:"复次：“须菩提！是法平等，无有高下，是名阿耨多罗三藐三菩提。以无我、无人、无众生、无寿者，修一切善法，则得阿耨多罗三藐三菩提。",tr:"再者：“须菩提！这个法是平等的，没有高下，这就叫做无上正等正觉。以没有我、没有人、没有众生、没有寿者的心，修一切善法，就能得到无上正等正觉。"},
{t:"须菩提！所言善法者，如来说即非善法，是名善法。”",tr:"须菩提！所说的善法，如来说并不是执着实有的善法，只是假名叫做善法。”"}]},{title:"福智无比分第二十四",summary:"以须弥山王那样多的七宝布施，仍比不上受持、讲说此经四句偈的福德。",s:[
{t:"“须菩提！若三千大千世界中，所有诸须弥山王，如是等七宝聚，有人持用布施。",tr:"“须菩提！如果三千大千世界中所有的须弥山王，有像这么多的七宝堆积，有人拿来布施。"},
{t:"若人以此般若波罗蜜经，乃至四句偈等，受持、读诵，为他人说，于前福德，百分不及一，百千万亿分，乃至算数譬喻所不能及。”",tr:"如果有人对这部般若波罗蜜经受持、读诵，哪怕只是其中的四句偈，并为他人讲说，前面的福德比起这个福德，百分不及其一，百千万亿分也不及，乃至用算数、譬喻都无法相比。”"}]},{title:"化无所化分第二十五",summary:"如来并没有“我度众生”的念头；若有这个念头，就是有我、人、众生、寿者之相。",s:[
{t:"“须菩提！于意云何？汝等勿谓如来作是念：‘我当度众生。’须菩提！莫作是念！",tr:"“须菩提！你怎么看？你们不要认为如来会这样想：‘我应当度众生。’须菩提！不要有这样的想法！"},
{t:"何以故？实无有众生如来度者。若有众生如来度者，如来即有我、人、众生、寿者。",tr:"为什么呢？实际上没有哪个众生是如来度的。如果有众生是如来度的，如来就有我、人、众生、寿者之相了。"},
{t:"须菩提！如来说有我者，则非有我，而凡夫之人，以为有我。须菩提！{凡夫|尚未觉悟、未入圣位的普通人。}者，如来说则非凡夫，是名凡夫。”",tr:"须菩提！如来说的“有我”，其实并不是真有我，而凡夫却以为有我。须菩提！所说的凡夫，如来说也不是实有的凡夫，只是假名叫做凡夫。”"}]},{title:"法身非相分第二十六",summary:"不可凭三十二相观如来，否则转轮圣王也成了如来；佛以偈作结：以色相、音声求佛，是行邪道。",s:[
{t:"“须菩提！于意云何？可以三十二相观如来不？”须菩提言：“如是！如是！以三十二相观如来。”",tr:"“须菩提！你怎么看？可以凭三十二相来观如来吗？”须菩提说：“是的，是的！可以凭三十二相来观如来。”"},
{t:"佛言：“须菩提！若以三十二相观如来者，{转轮圣王|佛经中的理想君主，经中说他也具有三十二相。}即是如来。”",tr:"佛说：“须菩提！如果凭三十二相来观如来，那么转轮圣王就是如来了。”"},
{t:"须菩提白佛言：“世尊！如我解佛所说义，不应以三十二相观如来。”",tr:"须菩提对佛说：“世尊！依我对佛所说道理的理解，不应当凭三十二相来观如来。”"},
{t:"尔时，世尊而说{偈|梵语 gāthā 的意译，诗句体的颂文。}言：“若以色见我，以音声求我，是人行邪道，不能见如来。”",tr:"这时，世尊说了一首偈：“如果凭色相来见我，凭音声来求我，这个人是在走邪道，不能见到如来。”"}]},{title:"无断无灭分第二十七",summary:"佛提醒：不要执着于“如来是否因具足相而成佛”，也不要以为发菩提心者主张诸法断灭，因为对于法不说断灭相。此段古来解释不一。",s:[
{t:"“须菩提！汝若作是念：‘如来不以{具足相|圆满的种种相好。}故，得阿耨多罗三藐三菩提。’须菩提！莫作是念：‘如来不以具足相故，得阿耨多罗三藐三菩提。’",tr:"“须菩提！你如果这样想：‘如来不是因为具足相好的缘故，才得到无上正等正觉。’须菩提！不要这样想：‘如来不是因为具足相好的缘故，才得到无上正等正觉。’"},
{t:"须菩提！汝若作是念，发阿耨多罗三藐三菩提心者，说诸法{断灭|认为一切法断绝消灭、什么都没有的偏见，即“断见”。}。",tr:"须菩提！你如果这样想：发无上正等正觉心的人，是主张诸法断灭的。"},
{t:"莫作是念！何以故？发阿耨多罗三藐三菩提心者，于法不说断灭相。”",tr:"不要这样想！为什么呢？发无上正等正觉心的人，对于法并不说断灭相。”"}]},{title:"不受不贪分第二十八",summary:"菩萨知一切法无我、成就忍，其功德胜过七宝布施；菩萨作福德而不贪着，所以说“不受福德”。",s:[
{t:"“须菩提！若菩萨以满恒河沙等世界七宝，持用布施。若复有人，知一切法无我，得成于{忍|一般解释为“无生法忍”，即对诸法无我之理的体认与安住。}。此菩萨胜前菩萨所得功德。",tr:"“须菩提！如果有菩萨用装满像恒河沙那么多世界的七宝来布施；又如果有人知道一切法无我，并能成就忍。这位菩萨所得的功德，胜过前面那位菩萨。"},
{t:"何以故？须菩提！以诸菩萨不受福德故。”",tr:"为什么呢？须菩提！因为诸位菩萨不受福德的缘故。”"},
{t:"须菩提白佛言：“世尊！云何菩萨，不受福德？”“须菩提！菩萨所作福德，不应贪着，是故说：不受福德。”",tr:"须菩提对佛说：“世尊！为什么菩萨不受福德呢？”“须菩提！菩萨所作的福德，不应当贪着，所以说：不受福德。”"}]},{title:"威仪寂静分第二十九",summary:"如来无所从来，亦无所去，所以叫如来；说如来有来去坐卧，是不理解佛所说的意思。",s:[
{t:"“须菩提！若有人言：‘如来若来、若去；若坐、若卧。’是人不解我所说义。",tr:"“须菩提！如果有人说：‘如来有来、有去、有坐、有卧。’这个人是不理解我所说的意思。"},
{t:"何以故？如来者，无所从来，亦无所去，故名如来。”",tr:"为什么呢？所谓如来，没有从哪里来，也没有往哪里去，所以叫做如来。”"}]},{title:"一合理相分第三十",summary:"以世界碎为微尘为喻，说明微尘、世界、一合相都只是假名，而凡夫却贪着其事。",s:[
{t:"“须菩提！若善男子、善女人，以三千大千世界碎为微尘；于意云何？是微尘众，宁为多不？”须菩提言：“甚多。世尊！",tr:"“须菩提！如果善男子、善女人，把三千大千世界碾碎成微尘，你怎么看？这些微尘多吗？”须菩提说：“很多，世尊！"},
{t:"何以故？若是微尘众实有者，佛则不说是微尘众。所以者何？佛说微尘众，即非微尘众，是名微尘众。",tr:"为什么呢？如果这些微尘是实有的，佛就不会说它们是微尘众。为什么这样说呢？佛所说的微尘众，并不是实有的微尘众，只是假名叫做微尘众。"},
{t:"世尊！如来所说三千大千世界，则非世界，是名世界。",tr:"世尊！如来所说的三千大千世界，并不是实有的世界，只是假名叫做世界。"},
{t:"何以故？若世界实有者，即是{一合相|众多事物聚合而成的整体之相；此处指把世界当作一个实有的整体。}；如来说一合相，则非一合相，是名一合相。”",tr:"为什么呢？如果世界是实有的，那就是一合相；如来说的一合相，并不是实有的一合相，只是假名叫做一合相。”"},
{t:"“须菩提！一合相者，则是不可说，但凡夫之人，贪着其事。”",tr:"“须菩提！所谓一合相，其实是不可言说的，只是凡夫之人贪着于这件事。”"}]},{title:"知见不生分第三十一",summary:"我见、人见、众生见、寿者见都不是实有；发菩提心者对一切法应如是知、如是见、如是信解，而不生法相。",s:[
{t:"“须菩提！若人言：‘佛说我见、人见、众生见、寿者见。’须菩提！于意云何？是人解我所说义不？”",tr:"“须菩提！如果有人说：‘佛说了我见、人见、众生见、寿者见。’须菩提！你怎么看？这个人理解我所说的意思吗？”"},
{t:"“不也，世尊！是人不解如来所说义。何以故？世尊说我见、人见、众生见、寿者见，即非我见、人见、众生见、寿者见，是名我见、人见、众生见、寿者见。”",tr:"“不是的，世尊！这个人不理解如来所说的意思。为什么呢？世尊所说的我见、人见、众生见、寿者见，并不是实有的我见、人见、众生见、寿者见，只是假名叫做我见、人见、众生见、寿者见。”"},
{t:"“须菩提！发阿耨多罗三藐三菩提心者，于一切法，应如是知、如是见、如是信解，不生{法相|执着“法”为实有的见解。}。须菩提！所言法相者，如来说即非法相，是名法相。”",tr:"“须菩提！发无上正等正觉心的人，对于一切法，应当这样知、这样见、这样信解，不生起法相。须菩提！所说的法相，如来说并不是实有的法相，只是假名叫做法相。”"}]},{title:"应化非真分第三十二",summary:"以不取于相、如如不动的态度为人演说；全经以“一切有为法，如梦幻泡影”之偈作结，大众欢喜奉行。",s:[
{t:"“须菩提！若有人以满无量{阿僧祇|意为“无数”。}世界七宝，持用布施。若有善男子、善女人，发菩提心者，持于此经，乃至四句偈等，受持、读诵，为人演说，其福胜彼。",tr:"“须菩提！如果有人用装满无量阿僧祇世界的七宝来布施；又如果有善男子、善女人发菩提心，对这部经受持、读诵，哪怕只是其中的四句偈，并为人演说，他的福德胜过前者。"},
{t:"云何为人演说？不取于相，如如不动。",tr:"怎样为人演说呢？不执取于相，安住于如如不动。"},
{t:"何以故？一切{有为法|由因缘造作、会生灭变化的一切现象。}，如梦、幻、泡、影；如露，亦如电，应作如是观。”",tr:"为什么呢？一切有为法，就像梦、像幻、像水泡、像影子；像露水，也像闪电，应当这样来观察。”"},
{t:"佛说是经已，长老须菩提，及诸比丘、比丘尼、{优婆塞|在家受五戒的男居士。}、{优婆夷|在家受五戒的女居士。}，一切世间天、人、阿修罗，闻佛所说，皆大欢喜，信受奉行。",tr:"佛说完这部经之后，长老须菩提，以及各位比丘、比丘尼、优婆塞、优婆夷，还有一切世间的天、人、阿修罗，听了佛所说的，都非常欢喜，信受奉行。"}]}
]}];

const $=id=>document.getElementById(id);
let st={b:0,c:0,tr:true,nt:true,py:true,fs:1};
try{Object.assign(st,JSON.parse(localStorage.getItem("guji")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("guji",JSON.stringify(st))}catch(e){}};
const esc=s=>s.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
let PY={};
function mark(t){const n=[],seen=new Set();const ry=x=>x.replace(/[\u4e00-\u9fff]/g,c=>PY[c]&&!seen.has(c)?(seen.add(c),`<ruby>${c}<rt>${PY[c]}</rt></ruby>`):c);
const h=t.split(/(\{[^|}]+\|[^}]+\})/).map(p=>{const m=p.match(/^\{([^|}]+)\|([^}]+)\}$/);if(m){n.push([m[1],m[2]]);return `<mark title="${esc(m[2]).replace(/"/g,"&quot;")}">${ry(esc(m[1]))}</mark>`}return ry(esc(p))}).join("");return{h,n}}

function drawNav(){
 const bk=LIBRARY[st.b];
 $("nav").innerHTML=`<select id="bs" aria-label="选择古籍">${LIBRARY.map((b,i)=>`<option value="${i}" ${i==st.b?"selected":""}>${b.title}</option>`).join("")}</select>`+
  bk.chapters.map((c,i)=>`<a class="${i==st.c?"cur":""} ${c.s.length?"":"empty"}" data-i="${i}" tabindex="0">${c.title}</a>`).join("");
 $("bs").onchange=e=>{st.b=+e.target.value;st.c=0;go()};
 $("nav").querySelectorAll("a").forEach(a=>{a.onclick=()=>{st.c=+a.dataset.i;go();$("nav").classList.remove("open")};a.onkeydown=e=>{if(e.key==="Enter")a.click()}});
}
function drawMain(){
 const bk=LIBRARY[st.b],c=bk.chapters[st.c];
 PY=bk.py||{};$("bt").textContent=bk.title;document.title=c.title+" · "+bk.title;
 document.documentElement.style.setProperty("--fs",st.fs);
 const body=c.s.length?c.s.map(x=>{const m=mark(x.t);return `<div class="s"><p class="t serif">${m.h}</p><p class="tr">${esc(x.tr)}</p>${m.n.length?`<ul class="nt">${m.n.map(k=>`<li><b>${k[0]}</b>　${k[1]}</li>`).join("")}</ul>`:""}</div>`}).join(""):`<div class="todo">本章内容尚未录入。按页面源码顶部的数据格式补充即可。</div>`;
 $("main").className=(st.tr?"":"hide-tr ")+(st.nt?"":"hide-nt")+(st.py?"":" hide-py");
 $("main").innerHTML=`<div class="tools"><button id="btr" class="${st.tr?"on":""}">译文</button><button id="bnt" class="${st.nt?"on":""}">批注</button><button id="bpy" class="${st.py?"on":""}">注音</button><button id="fm">A−</button><button id="fp">A+</button><span style="color:var(--sub);font-size:14px">${bk.sub}　第 ${st.c+1}/${bk.chapters.length} 章</span></div>
 <h2 class="serif">${c.title}</h2>${c.summary?`<p class="sum">${c.summary}</p>`:""}${body}
 <div class="pager"><button id="pv" ${st.c==0?"disabled":""}>上一章</button><button id="nx" ${st.c==bk.chapters.length-1?"disabled":""}>下一章</button></div>`;
 $("btr").onclick=()=>{st.tr=!st.tr;go(1)};$("bpy").onclick=()=>{st.py=!st.py;go(1)};$("bnt").onclick=()=>{st.nt=!st.nt;go(1)};
 $("fm").onclick=()=>{st.fs=Math.max(.8,st.fs-.1);go(1)};$("fp").onclick=()=>{st.fs=Math.min(1.6,st.fs+.1);go(1)};
 $("pv").onclick=()=>{st.c--;go()};$("nx").onclick=()=>{st.c++;go()};
}
function go(keep){save();drawNav();drawMain();if(!keep)window.scrollTo(0,0)}
$("menu").onclick=()=>$("nav").classList.toggle("open");
$("th").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"};
go(1);
</script>
</body>
</html>
